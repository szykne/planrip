        const container = document.getElementById('free-rooms-container');
        const headerInfo = document.getElementById('selected-info-header');

        function updateSelection() {
            dayButtons.forEach(btn => {
                if (parseInt(btn.getAttribute('data-day')) === activeDay) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });

                    btn.classList.remove('selected');
                }

            const rooms = FREE_ROOMS_DATA[key] || [];

            if (rooms.length === 0) {
                container.innerHTML = '<div class="wolnesale_no_results">Brak wolnych sal w wybranym terminie.</div>';
            } else {
                let html = '';
                rooms.forEach(r => {
                    html += `<a class="wolnesale_room_link" href="../sale/${r.code}.html">${r.name}</a>`;
                });
                container.innerHTML = html;
            }
        }

        dayButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                activeDay = parseInt(btn.getAttribute('data-day'));
                updateSelection();
            });
        });

        periodButtons.forEach(btn => {
            btn.addEventListener('click', () => {

                updateSelection();
            });
        });
